name: Update US release calendar

on:
  workflow_dispatch:
  schedule:
    # 매일 07:10 UTC (16:10 KST). 미 지표는 08:30 ET에 발표되므로 그 전에 하루치
    # 일정을 갱신해 두는 시각이다.
    - cron: "10 7 * * *"

permissions:
  contents: write
  # Same reason as update-baseline.yml: a push made with the default GITHUB_TOKEN
  # does not trigger workflows, so the deploy has to be dispatched explicitly or
  # the committed calendar never reaches the site.
  actions: write

concurrency:
  group: update-economic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # FRED is a US service reachable from a US runner, which is why this can be
      # a cron job at all — unlike the futures collector, which the runners are
      # geo-blocked from and which the browser therefore does itself.
      - name: Refresh release calendar
        run: npm run data:economic
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit updated calendar
        id: commit
        run: |
          if git diff --quiet public/data/economic.json; then
            echo "economic.json unchanged, skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add public/data/economic.json
          git commit -m "chore(data): refresh US release calendar $(date -u '+%Y-%m-%d')"
          git push

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the new calendar
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
