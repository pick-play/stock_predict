name: Update US release calendar

on:
  workflow_dispatch:
  schedule:
    # 매일 07:10 UTC (16:10 KST). 미 지표는 08:30 ET에 발표되므로 그 전에 하루치
    # 일정을 갱신해 두는 시각이다.
    - cron: "10 7 * * *"
    # 캐치업(21:10 KST) — 아침 슬롯이 누락된 날을 같은 날 안에 메운다.
    # 스크립트가 멱등이라 정상일에는 no-op이다.
    - cron: "10 12 * * *"

permissions:
  contents: write
  # Same reason as update-baseline.yml: a push made with the default GITHUB_TOKEN
  # does not trigger workflows, so the deploy has to be dispatched explicitly or
  # the committed calendar never reaches the site.
  actions: write

concurrency:
  group: update-economic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # FRED is a US service reachable from a US runner, which is why this can be
      # a cron job at all — unlike the futures collector, which the runners are
      # geo-blocked from and which the browser therefore does itself.
      - name: Refresh release calendar
        run: npm run data:economic
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit updated calendar
        id: commit
        run: |
          if git diff --quiet public/data/economic.json; then
            echo "economic.json unchanged, skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add public/data/economic.json
          git commit -m "chore(data): refresh US release calendar $(date -u '+%Y-%m-%d')"

          # A push can fail for two reasons that both clear on a retry: GitHub
          # answering 500 — which is exactly what killed the 2026-08-14 close
          # anchor after the prices had already been fetched and committed — and
          # another bot commit landing in between. Rebase covers the second,
          # repetition the first. Without this the run died holding good data.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              pushed=true
              break
            fi
            echo "push attempt $attempt failed; refetching and retrying"
            sleep $((attempt * 5))
            git pull --rebase --autostash origin main || true
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the refreshed calendar after 5 attempts"
            exit 1
          fi

          # After the loop: a rebase rewrites the commit, so the SHA the deploy
          # waits for has to be read here rather than before the push.

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # workflow_dispatch resolves `main` server-side, and it can still resolve to
      # the commit *before* the push above — that raced on 2026-08-12 and built a
      # tree without the close anchor, so the data sat in git undeployed for the
      # rest of the day. Wait until the API agrees main is the commit we pushed.
      - name: Wait for the push to be visible
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ steps.commit.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            seen=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$seen" = "$WANT" ]; then
              echo "main is $seen"
              exit 0
            fi
            echo "main is $seen, waiting for $WANT ($i/30)"
            sleep 4
          done
          # Deploying the wrong tree silently is the failure this step exists to
          # prevent, so give up loudly instead.
          echo "::error::main never advanced to $WANT; not dispatching a deploy"
          exit 1

      - name: Deploy the new calendar
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
