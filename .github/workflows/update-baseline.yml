name: Update KRX baseline

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Which anchor to refresh"
        type: choice
        options: [open, close]
        default: close
  schedule:
    # 종가 앵커: 정규장 마감(15:30 KST = 06:30 UTC) 후 10분 여유.
    #
    # 시가 앵커용 09:20 실행은 제거했다(2026-08-18 소유자 결정). 예상가는 이제
    # 종가만 기준으로 삼으므로 아무도 읽지 않는 값을 매일 아침 커밋하고 그때마다
    # 배포까지 돌리고 있었다. close 실행이 같은 일봉에서 시가와 종가를 함께
    # 기록하므로 open 블록 자체는 계속 최신으로 유지된다.
    - cron: "40 6 * * 1-5"
    # 캐치업 슬롯(19:40·22:40 KST). GitHub의 cron은 보장이 아니라 best-effort라
    # 2026-08-27에는 이 저장소의 예약 실행이 통째로 누락됐고, 그날 밤 카드가
    # 전일 종가를 기준으로 계산했다. 스크립트는 멱등이라("이미 최신. 스킵")
    # 아침 실행이 성공한 날의 캐치업은 20초짜리 no-op으로 끝난다 — 커밋도
    # 배포도 만들지 않는다.
    - cron: "40 10 * * 1-5"
    - cron: "40 13 * * 1-5"

permissions:
  contents: write
  # actions: write lets the commit step dispatch deploy-pages.yml. A push made
  # with the default GITHUB_TOKEN does not trigger workflows, so without an
  # explicit dispatch the new anchor is committed but never deployed.
  actions: write

concurrency:
  group: update-baseline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The morning cron refreshes the opening anchor; the afternoon cron (and
      # any manual run without an input) refreshes the closing anchor, which
      # also finalises that day's opening price.
      - name: Resolve session
        id: session
        run: |
          if [ -n "${{ github.event.inputs.session }}" ]; then
            echo "value=${{ github.event.inputs.session }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=close" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh KRX baseline
        run: npm run data:baseline -- --session=${{ steps.session.outputs.value }}

      - name: Run data validation
        run: npm run data:validate

      - name: Commit updated baseline
        id: commit
        run: |
          if git diff --quiet public/data/baseline.json; then
            echo "baseline.json unchanged, skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add public/data/baseline.json
          git commit -m "chore(data): refresh KRX ${{ steps.session.outputs.value }} anchor $(date -u '+%Y-%m-%d')"

          # A push can fail for two reasons that both clear on a retry: GitHub
          # answering 500 — which is exactly what killed the 2026-08-14 close
          # anchor after the prices had already been fetched and committed — and
          # another bot commit landing in between. Rebase covers the second,
          # repetition the first. Without this the run died holding good data.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              pushed=true
              break
            fi
            echo "push attempt $attempt failed; refetching and retrying"
            sleep $((attempt * 5))
            git pull --rebase --autostash origin main || true
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the refreshed baseline after 5 attempts"
            exit 1
          fi

          # After the loop: a rebase rewrites the commit, so the SHA the deploy
          # waits for has to be read here rather than before the push.

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # workflow_dispatch resolves `main` server-side and can still resolve to the
      # commit *before* the push above. That raced on 2026-08-12: the close anchor
      # was committed, the deploy built the previous tree, and the day's closing
      # prices sat in git unpublished. Wait until the API agrees main is the commit
      # we just pushed.
      - name: Wait for the push to be visible
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ steps.commit.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            seen=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$seen" = "$WANT" ]; then
              echo "main is $seen"
              exit 0
            fi
            echo "main is $seen, waiting for $WANT ($i/30)"
            sleep 4
          done
          # Deploying the wrong tree silently is the failure this step exists to
          # prevent, so give up loudly instead.
          echo "::error::main never advanced to $WANT; not dispatching a deploy"
          exit 1

      - name: Deploy the new anchor
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
