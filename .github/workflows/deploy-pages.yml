name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Hand-pushed commits only. The site reads baseline.json from its own origin
    # rather than from raw.githubusercontent, which kept the account and
    # repository name out of the shipped bundle; the anchor therefore has to
    # ship with the site.
    #
    # Data commits do NOT arrive here as push events — GitHub suppresses workflow
    # triggers for pushes made with the default GITHUB_TOKEN. update-baseline.yml
    # instead calls the workflow_dispatch below after it pushes, which costs two
    # extra builds per weekday (09:20 and 15:40 KST).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Both are public values baked into the bundle: the Worker URL is a
          # public endpoint and the Turnstile site key is designed to be shipped
          # to browsers. They live in repository variables so the board can be
          # pointed elsewhere without a code change. Leave them unset and the
          # board renders its "준비 중" notice instead of calling anything.
          VITE_BOARD_API_BASE: ${{ vars.VITE_BOARD_API_BASE }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
