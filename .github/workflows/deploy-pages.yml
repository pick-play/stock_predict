name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Data snapshots (public/data/**) are committed every 5 minutes by
    # update-market-data.yml. Excluding them here prevents a full
    # lint + typecheck + test + build cycle on every data commit.
    #
    # Deployment strategy decision:
    #   - The browser fetches live prices directly from the Binance API.
    #   - public/data/latest.json on GitHub Pages is the last-resort fallback
    #     (used when Binance is unreachable). It is acceptable for this fallback
    #     to reflect the last code-change deployment rather than the last 5-min
    #     data commit.
    #   - If fresher fallback data on Pages is required in future, add a
    #     lightweight deploy step at the end of update-market-data.yml.
    paths-ignore:
      - "public/data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
