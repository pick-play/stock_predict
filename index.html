<!DOCTYPE html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vite rewrites these root-relative paths with the configured base. -->
    <!--
      favicon.ico first, and it exists as a real file.
      Crawlers and older clients request /favicon.ico by convention whatever the
      link tags say, and on this SPA that request was answering 404 with the
      fallback HTML page — an icon that resolves to a web page is no icon.

      The PNG declarations lead with 48px because Google asks for a multiple of
      48 and will pass over a 32px icon; 192 is there for the size a phone's
      home screen and a search result actually render.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#080b10" />

    <meta name="naver-site-verification" content="1a6c656975c8e475d9e389dea8498e5cafad108f" />

    <!-- Google AdSense. async so it never blocks the first paint (§22). -->
    <script

      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7766090864059500"
      crossorigin="anonymous"
    ></script>

    <!--
      Settles the theme before first paint. A saved choice has to be stamped on
      <html> or a reader who picked light gets a dark flash on every load, since
      React mounts only after the stylesheet has painted. With no saved choice
      nothing is stamped — the device setting wins through the media query — but
      the theme-color meta is still corrected, because its markup value is a
      fixed dark and would otherwise tint a light phone's browser chrome.
    -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("kospinow:theme");
        } catch (e) {
          /* private mode — the device setting still applies below */
        }
        if (t !== "light" && t !== "dark") {
          // No override: leave data-theme unset so the stylesheet's
          // prefers-color-scheme block decides, and only correct the chrome
          // colour, which is a static dark value in the markup and would
          // otherwise stay dark on a light device until React mounts.
          t = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        } else {
          document.documentElement.dataset.theme = t;
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", t === "light" ? "#f6f8fb" : "#080b10");
        }
      })();
    </script>

    <!--
      Chrome fires this once, early, and there is no way to ask for it again.
      React has not mounted yet at that point, so the event is stashed here for
      the install button to pick up when it does.
    -->
    <script>
      window.__installPromptEvent = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__installPromptEvent = event;
      });
    </script>

    <!--
      alternateName is the field made for "this site is also called that", and it
      is the honest way to answer 코스피나우 / 코스피 NOW / KOSPI NOW without
      repeating three spellings in the visible header.

      Type is WebSite, deliberately. §20 forbids presenting this service as an
      exchange or a broker, which is exactly what FinancialService would claim.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "코스피 NOW",

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2N34C009M9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <!--
      Pretendard, as a variable font split into unicode-range chunks.

      The static stylesheet that used to be here defines one whole file per
      weight, and this site sets five of them — 400, 500, 600, 700 and 800. Each
      of those files is about 780 KB of Korean glyphs, so a first visit pulled
      roughly 3.9 MB of font against a 110 KB script bundle. Nothing was wrong
      with it; it is simply the wrong shape for a Korean page.

      The dynamic subset splits the face into 92 ranges and the browser fetches
      only the ones holding glyphs that actually appear — a few chunks of ~35 KB
      each. One variable file covers every weight, so adding a sixth costs
      nothing. Both stay font-display:swap, so neither blocks the first paint.

      index.css asks for 'Pretendard Variable' first and plain Pretendard next,
      which is what a reader with the font installed locally already has.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
