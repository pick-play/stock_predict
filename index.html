<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vite rewrites these root-relative paths with the configured base. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#080b10" />
    <meta name="google-site-verification" content="Ym0Wv9RZlsxVLfBz0tc4iXrw6Ax_PQtT5FpwZz3HgmU" />
    <meta name="naver-site-verification" content="1a6c656975c8e475d9e389dea8498e5cafad108f" />

    <!--
      Applies a saved theme before first paint. Without this a reader who chose
      the light palette gets a dark flash on every load, because React only
      mounts after the stylesheet has already painted the default.
    -->
    <script>
      try {
        var t = localStorage.getItem("kospinow:theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "light" ? "#f6f8fb" : "#080b10");
        }
      } catch (e) {
        /* private mode — fall back to the media query */
      }
    </script>

    <meta
      name="description"
      content="해외 선물가격의 야간 변동을 바탕으로 삼성전자와 SK하이닉스의 참고 예상가격을 제공합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KOSPI NOW" />
    <meta property="og:url" content="https://kospinow.com/" />
    <meta property="og:title" content="KOSPI NOW | 삼성전자·SK하이닉스 야간 참고가격" />
    <meta
      property="og:description"
      content="해외 선물가격의 야간 변동을 바탕으로 삼성전자와 SK하이닉스의 참고 예상가격을 제공합니다."
    />
    <!-- Social crawlers need an absolute URL; Vite only rewrites link/script paths. -->
    <meta
      property="og:image"
      content="https://kospinow.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KOSPINOW — 장이 닫혀도 시장은 움직입니다" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://kospinow.com/og-image.jpg"
    />

    <title>KOSPI NOW | 삼성전자·SK하이닉스 야간 참고가격</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2N34C009M9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-2N34C009M9");
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
