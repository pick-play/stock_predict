  <head>
    <meta charset="UTF-8" />

    <!-- Vite rewrites these root-relative paths with the configured base. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <meta name="naver-site-verification" content="1a6c656975c8e475d9e389dea8498e5cafad108f" />

    <!-- Google AdSense. async so it never blocks the first paint (§22). -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7766090864059500"
      crossorigin="anonymous"
    ></script>

    <!--
      Settles the theme before first paint. A saved choice has to be stamped on
      <html> or a reader who picked light gets a dark flash on every load, since
      React mounts only after the stylesheet has painted. With no saved choice
      nothing is stamped — the device setting wins through the media query — but
      the theme-color meta is still corrected, because its markup value is a
      fixed dark and would otherwise tint a light phone's browser chrome.
    -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("kospinow:theme");
        } catch (e) {
          /* private mode — the device setting still applies below */
        }
        if (t !== "light" && t !== "dark") {
          // No override: leave data-theme unset so the stylesheet's
          // prefers-color-scheme block decides, and only correct the chrome
          // colour, which is a static dark value in the markup and would
          // otherwise stay dark on a light device until React mounts.
          t = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        } else {
          document.documentElement.dataset.theme = t;
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", t === "light" ? "#f6f8fb" : "#080b10");
        }
      })();
    </script>

    <meta
      name="description"
      content="코스피 NOW(코스피나우) — 야간선물(야선) 해외 선물가격의 변동으로 삼성전자·SK하이닉스의 야간·주말 참고 예상가격을 보여줍니다. 실제 체결가가 아닌 참고정보입니다."
    />
    <!-- Naver still reads a keywords meta, unlike Google. Kept to terms the site
         genuinely serves; padding it with 주식추천 or 실시간주가 would be both
         useless and a claim §1 forbids. -->
    <meta
      name="keywords"
      content="코스피나우, 코스피 NOW, KOSPI NOW, kospinow, 코스피 나우, 야간선물, 야선, 코스피 야간, 삼성전자 야간가, SK하이닉스 야간가, 해외선물, 야간 시세"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="코스피 NOW" />
    <meta property="og:url" content="https://kospinow.com/" />
    <meta property="og:title" content="코스피 NOW | 야간선물·야선 기반 삼성전자·SK하이닉스 야간 시세" />
    <meta
      property="og:description"
      content="코스피 NOW(코스피나우) — 야간선물(야선) 해외 선물가격의 변동으로 삼성전자·SK하이닉스의 야간·주말 참고 예상가격을 보여줍니다. 실제 체결가가 아닌 참고정보입니다."
    />
    <!-- Social crawlers need an absolute URL; Vite only rewrites link/script paths. -->
    <meta
      property="og:image"
      content="https://kospinow.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KOSPINOW — 장이 닫혀도 시장은 움직입니다" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://kospinow.com/og-image.jpg"
    />

    <title>코스피 NOW | 야간선물·야선 기반 삼성전자·SK하이닉스 야간 시세</title>

    <!--
      alternateName is the field made for "this site is also called that", and it
      is the honest way to answer 코스피나우 / 코스피 NOW / KOSPI NOW without
      repeating three spellings in the visible header.

      Type is WebSite, deliberately. §20 forbids presenting this service as an
      exchange or a broker, which is exactly what FinancialService would claim.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "코스피 NOW",
        "alternateName": ["코스피나우", "KOSPI NOW", "kospinow", "코스피 나우"],
        "url": "https://kospinow.com/",
        "inLanguage": "ko",
        "description": "야간선물 해외 선물가격의 변동으로 삼성전자·SK하이닉스의 야간·주말 참고 예상가격을 보여주는 참고 서비스입니다. 실제 체결가격이 아닙니다."
      }
    </script>

      gtag("js", new Date());
      gtag("config", "G-2N34C009M9");
